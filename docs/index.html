<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><title>Factory session bind</title>
<style>body{font-family:ui-sans-serif,system-ui,sans-serif;margin:2rem;max-width:44rem}</style></head>
<body>
<h1>Factory session bind</h1>
<p>Jobs are stored under a worker id.</p>
<label>worker <input id="w" value="w1" /></label>
<button id="go">Enqueue</button>
<pre id="out"></pre>
<script>
const TASKS = {};
let n = 0;
function enqueue(job, workerId) {
  if (!workerId) throw new Error("factory job requires a worker id");
  (TASKS[workerId] ||= []).push(job);
}
document.getElementById("go").onclick = () => {
  const out = document.getElementById("out");
  try {
    enqueue({step: ++n}, document.getElementById("w").value);
    out.textContent = JSON.stringify(TASKS, null, 2);
  } catch (e) { out.textContent = e.message; }
};
</script>
</body></html>
